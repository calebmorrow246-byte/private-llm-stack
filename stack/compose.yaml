# Local LLM inference stack for ai02 (Qdrant + LiteLLM + Open WebUI).
# Ollama itself is NOT containerized here - it runs natively on the host (systemd)
# so it can be NUMA-pinned with numactl. See ../Deploy-LlmStack.ps1.
#
# Deployed to /opt/llm/compose.yaml on the host. Secrets come from /opt/llm/.env
# (generated by Deploy-LlmStack.ps1, never committed).

networks:
  llm-net:
    driver: bridge

volumes:
  qdrant-data:
  open-webui-data:

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: llm-qdrant
    restart: unless-stopped
    networks: [llm-net]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: llm-litellm
    restart: unless-stopped
    networks: [llm-net]
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  rag-proxy:
    build: ../rag-proxy
    container_name: llm-rag-proxy
    restart: unless-stopped
    networks: [llm-net]
    ports:
      - "127.0.0.1:8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAG_PROXY_API_KEY: ${RAG_PROXY_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_CHAT_MODEL: llama-3.1-8b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_BASE_URL: http://qdrant:6333
      KB_TENANT_ID: ${KB_TENANT_ID}
    depends_on: [qdrant, litellm]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: llm-open-webui
    restart: unless-stopped
    depends_on: [qdrant, litellm, rag-proxy]
    networks: [llm-net]
    ports:
      - "0.0.0.0:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Two OpenAI-compatible connections, semicolon-delimited and index-matched:
      # LiteLLM (general chat models) + rag-proxy (the FreshService KB agent, which
      # does its own retrieval - see rag-proxy/app.py for why Open WebUI's own RAG
      # mechanisms weren't reliable enough to use directly).
      OPENAI_API_BASE_URLS: "http://litellm:4000/v1;http://rag-proxy:8010/v1"
      OPENAI_API_KEYS: "${LITELLM_MASTER_KEY};${RAG_PROXY_API_KEY}"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENABLE_OLLAMA_API: "false"
      ENABLE_SIGNUP: "true"
      WEBUI_AUTH: "true"
    volumes:
      - open-webui-data:/app/backend/data
